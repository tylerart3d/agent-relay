[package]
name = "agent-relay"
version = "0.16.14"
publish = false
license-file = "../LICENSE"
description = "Tray control plane for private multi-host inference"
authors = ["Brent"]
edition = "2021"
default-run = "agent-relay"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
async-stream = "0.3"
base64 = "0.22"
futures-util = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
hostname = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
toml_edit = "0.23"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39"
rusty-leveldb = "4.0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = "4.1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
