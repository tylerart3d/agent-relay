# Agent Relay runtime profile examples. Replace every placeholder path/model.
# These profiles remain idle until selected through Agent Relay.
healthCheckTimeout: 600
globalTTL: 1800
unloadTimeout: 10

models:
  qwen-vllm:
    name: Qwen (vLLM)
    cmd: >
      vllm serve Qwen/Qwen3-8B
      --host 127.0.0.1
      --port ${PORT}
      --served-model-name qwen-vllm
      --max-model-len 65536
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    useModelName: qwen-vllm
    metadata:
      runtime: vllm
      kind: text
      capabilities: [chat, completions, responses]
      resource_pool: gpu0
      context_length: 65536

  qwen-llama-cpp:
    name: Qwen (llama.cpp)
    cmd: >
      llama-server --model C:/replace/with/qwen.gguf
      --host 127.0.0.1 --port ${PORT} --alias ${MODEL_ID}
      --ctx-size 65536 --parallel 1 --flash-attn on --jinja
    proxy: http://127.0.0.1:${PORT}
    metadata:
      runtime: llama.cpp
      kind: text
      capabilities: [chat, completions, responses, anthropic_messages]
      resource_pool: gpu0
      context_length: 65536
      inference_controls:
        thinking:
          adapter: llama_cpp
          efforts: [off, low, medium, xhigh]
          default_effort: low
          budget_min: -1
          budget_max: 16384
          budget_step: 256
          default_budget: -1
        temperature:
          min: 0.0
          max: 2.0
          step: 0.05
          default: 0.3

  qwen-ollama:
    name: Qwen (Ollama)
    cmd: ollama serve
    env:
      - OLLAMA_HOST=127.0.0.1:11435
      - OLLAMA_KEEP_ALIVE=1800
      - OLLAMA_MAX_LOADED_MODELS=1
    proxy: http://127.0.0.1:11435
    checkEndpoint: /api/tags
    useModelName: qwen3:8b
    metadata:
      runtime: ollama
      kind: text
      capabilities: [chat, completions, responses, embeddings]
      resource_pool: gpu0
      context_length: 65536

  muse-glimmer-llama-cpp:
    name: Muse Glimmer (llama.cpp)
    cmd: >
      llama-server --model C:/replace/with/muse-glimmer.gguf
      --host 127.0.0.1 --port ${PORT} --alias ${MODEL_ID}
      --ctx-size 32768 --parallel 1 --flash-attn on --jinja
      --temp 1.0 --top-p 0.95 --top-k 64
    proxy: http://127.0.0.1:${PORT}
    metadata:
      runtime: llama.cpp
      kind: text
      capabilities: [chat, completions, responses, anthropic_messages]
      context_length: 32768
      inference_controls:
        thinking:
          adapter: muse_system_prompt
          efforts: [low, medium, high, xhigh]
          default_effort: low
        temperature:
          min: 0.0
          max: 2.0
          step: 0.05
          default: 1.0

  comfy-workflows:
    name: ComfyUI Workflows
    cmd: >
      python C:/replace/with/ComfyUI/main.py
      --listen 127.0.0.1
      --port ${PORT}
      --disable-auto-launch
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /system_stats
    metadata:
      runtime: comfyui
      kind: image
      capabilities: [image_generation, workflow_queue]
      resource_pool: gpu0
